# Minimal local eLabFTW 6 (nginx + php-fpm + MySQL) for developing the Lab Assistant / Lab Chatbot.
#
# Derived from the full, commented template that `get.elabftw.net` generates. This file contains NO
# secrets: they are read from deploy/elabftw/.env (copy .env.example, never commit .env).
#
#   cd deploy/elabftw
#   cp .env.example .env        # then fill in the values (see the comments there)
#   docker compose -f docker-compose.example.yml up -d
#
# eLabFTW is then at https://localhost:8443 (self-signed certificate -> the repo's default
# ELABFTW_VERIFY_TLS handling accepts it for localhost). Optional services of the full template
# (e.g. OpenCloning) are intentionally left out; add them back from your own compose if you use them.

name: elabftw

networks:
  elabftw-net:

services:
  web:
    image: elabftw/elabimg:stable          # pin a version (e.g. elabftw/elabimg:6.x.y) for reproducibility
    # run as an unprivileged user: put `id -u` / `id -g` of that user into .env
    user: "${ELAB_UID:-1000}:${ELAB_GID:-1000}"
    read_only: true
    restart: always
    container_name: elabftw
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:mode=755,uid=${ELAB_UID:-1000},gid=${ELAB_GID:-1000},exec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=elabftw
      - DB_USER=elabftw
      - DB_PASSWORD=${ELAB_DB_PASSWORD:?set ELAB_DB_PASSWORD in deploy/elabftw/.env}
      # encrypts SMTP/timestamp passwords stored in eLabFTW. MUST be generated, see .env.example.
      # Changing it later makes those stored passwords unreadable.
      - SECRET_KEY=${ELAB_SECRET_KEY:?set ELAB_SECRET_KEY in deploy/elabftw/.env}
      - SITE_URL=https://localhost:8443
      - DISABLE_HTTPS=false
      - GENERATE_TLS_CERT=true              # self-signed certificate, fine for localhost only
      - PHP_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
    ports:
      - "127.0.0.1:8443:8080"               # reachable from this machine only
    volumes:
      - ./data/cache:/var/cache/elabftw
      - ./data/uploads:/var/lib/elabftw/uploads
      - ./data/exports:/var/lib/elabftw/exports
    networks:
      - elabftw-net

  mysql:
    image: mysql:8.4
    restart: always
    container_name: mysql
    healthcheck:
      test: "/usr/bin/mysql --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD --execute 'SHOW DATABASES;'"
      interval: 5s
      timeout: 5s
      retries: 42
    cap_drop:
      - AUDIT_WRITE
      - MKNOD
      - SYS_CHROOT
      - SETFCAP
      - NET_RAW
    cap_add:
      - SYS_NICE
    environment:
      - MYSQL_ROOT_PASSWORD=${ELAB_MYSQL_ROOT_PASSWORD:?set ELAB_MYSQL_ROOT_PASSWORD in deploy/elabftw/.env}
      - MYSQL_DATABASE=elabftw
      - MYSQL_USER=elabftw
      # must equal DB_PASSWORD of the web container
      - MYSQL_PASSWORD=${ELAB_DB_PASSWORD:?set ELAB_DB_PASSWORD in deploy/elabftw/.env}
      - TZ=Europe/Berlin
    volumes:
      - ./data/mysql:/var/lib/mysql
    expose:
      - "3306"
    networks:
      - elabftw-net
